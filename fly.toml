app = 'planning-poker-sse'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = '15s'

[build]

[env]
  APP_ENV = 'production'
  APP_ORIGIN = 'https://planning-poker-sse.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    grace_period = '5s'
    interval = '15s'
    method = 'GET'
    path = '/readyz'
    timeout = '3s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
