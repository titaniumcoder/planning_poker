name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l go/cmd go/internal)"
      - name: Vet
        working-directory: go
        run: go vet ./cmd/... ./internal/...
      - name: Lint
        working-directory: go
        run: go tool golangci-lint run ./cmd/... ./internal/...
      - name: Test with race detector
        working-directory: go
        run: go test -race ./cmd/... ./internal/...
      - name: Scan Go dependencies
        working-directory: go
        run: go tool govulncheck ./cmd/... ./internal/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: go/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  phoenix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planning_poker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/planning_poker_test
    defaults:
      run:
        working-directory: elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix deps.get
      - run: mix precommit

  image:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: go/web/package-lock.json
      - name: Lint workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0-debian < Dockerfile
      - name: Build production image
        run: docker build -t planning-poker:test .
      - name: Start production image
        run: |
          docker run --detach --rm --name planning-poker-test \
            -p 8080:8080 \
            -e APP_ENV=production \
            -e APP_ORIGIN=http://127.0.0.1:8080 \
            planning-poker:test
      - name: Wait for readiness
        run: |
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/readyz && exit 0
            sleep 1
          done
          docker logs planning-poker-test
          exit 1
      - name: Install browser test dependencies
        working-directory: go/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: go/web
        run: npm run test:e2e
      - name: Stop production image
        if: always()
        run: docker stop planning-poker-test || true

  deploy:
    runs-on: ubuntu-latest
    needs: [go, web, phoenix, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy exact main revision
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
