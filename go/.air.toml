root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/planning-poker.exe ./cmd/server"
entrypoint = ["./tmp/air/planning-poker.exe"]
delay = 300
exclude_dir = ["tmp", "web", "vendor", "internal/web/dist"]
exclude_regex = ["_test.go"]
include_ext = ["go"]
kill_delay = "2s"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
